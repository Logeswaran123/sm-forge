patterns:
- id: sm120_gemm_tiles
  stage: device_specific
  arch: {min: 120, max: 121}
  applies_to: [gemm, matmul, bmm]
  summary: >-
    On sm_120 (RTX 50 series) fp16 GEMMs run best with 64x64 or 64x128 tiles and 4 warps;
    128x128 tiles with 8 warps are slower.
  how: >-
    Consumer Blackwell has 99 KB of shared memory per block and issues mma.sync, not wgmma or
    tcgen05, so the large tiles tuned for H100 and B200 lose occupancy without raising MMA
    throughput. Start from BLOCK 64x64x64, num_warps=4, num_stages=3.
  example: gemm_sm120_tiles
