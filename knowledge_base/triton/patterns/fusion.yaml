patterns:
- id: gemm_epilogue_fusion
  stage: fusion
  applies_to: [gemm, matmul, bmm]
  summary: >-
    Apply bias, activations, scales and residual adds to the fp32 accumulator before the
    GEMM's store, instead of writing C and running elementwise kernels over it.
  how: >-
    After the K loop, load the per-column vectors (bias, scale) once per tile with the N mask,
    apply the elementwise chain on acc in float32, then cast and store. Each separate
    elementwise kernel costs a full read and write of C.
  example: gemm_epilogue_fusion

- id: batch_in_one_launch
  stage: fusion
  applies_to: [bmm, attention, moe, any]
  summary: >-
    Put the batch (or head, or expert) index on a grid axis and launch once, instead of a
    Python loop that launches one kernel per batch.
  how: >-
    Use grid = (tiles, batch) and offset every pointer by program_id(1) * batch_stride. A loop
    of launches pays launch latency per batch and leaves the GPU idle whenever one launch has
    too few tiles to fill the SMs.
  example: bmm_batch_in_grid

- id: online_softmax
  stage: fusion
  applies_to: [softmax, attention, loss]
  summary: >-
    Compute the softmax normalizer in one pass over the row with a running max and a running
    sum rescaled by exp(m_old - m_new), instead of separate passes for the max and the sum.
  how: >-
    Keep per-lane m and s in float32. For each block: m_new = max(m, x), s = s * exp(m - m_new)
    + exp(x - m_new). Combine lanes at the end, then write exp(x - m) / s in a second pass.
    Guard m_new == -inf for lanes that have seen only masked values. This saves one full
    read of the row.
  example: softmax_online_normalizer

- id: row_stats_and_normalize_in_one_kernel
  stage: fusion
  applies_to: [norm, any]
  summary: >-
    Compute a row's statistics and normalize it in the same program while the row is in
    registers, instead of separate kernels for the mean, the variance and the output.
  how: >-
    One program per row loads the row once (BLOCK = next_power_of_2(N)), computes the mean,
    the variance from x - mean, and writes (x - mean) * rstd * w + b. Separate kernels read
    the row once per statistic and pay a launch each.
  example: layernorm_one_kernel

- id: reduction_in_epilogue
  stage: fusion
  applies_to: [conv2d, conv3d, gemm, matmul]
  summary: >-
    When a GEMM or convolution is followed by a pooling or sum over its rows, reduce each
    output tile in the epilogue and write partial sums, instead of storing the full output
    and reading it back.
  how: >-
    Tile rows within one image (grid (n, row_tiles, col_tiles)) so a tile's rows share the
    reduction target. In the epilogue zero masked rows, take tl.sum(acc, axis=0) and store
    the partial row to workspace[n, row_tile, :]; a small kernel sums the partials and
    scales. This removes a write and a read of the full activation.
  example: conv_pool_epilogue
