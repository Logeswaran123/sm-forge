patterns:
- id: split_k_for_small_mn
  stage: persistent_kernel
  applies_to: [gemm, matmul]
  summary: >-
    When cdiv(M, BLOCK_M) * cdiv(N, BLOCK_N) is far below the SM count and K is large, split K
    across programs and reduce the partial tiles afterwards.
  how: >-
    Add a grid axis over SPLIT chunks of K; each program writes its fp32 partial tile to a
    workspace[SPLIT, M, N], then a second kernel sums over SPLIT and casts. Pick SPLIT so
    tiles * SPLIT covers a few waves of the SMs. A 256x256 output has 16 tiles of 64x64,
    leaving most of 84 SMs idle without the split.
  example: gemm_split_k
