constraints:
- id: dot_operand_min_16
  severity: critical
  stages: [fusion, memory_access, tensor_descriptors, persistent_kernel, device_specific, autotuning]
  rule: >-
    Every dimension of a tl.dot operand must be at least 16, so BLOCK_M, BLOCK_N and BLOCK_K
    are each >= 16. Below that Triton cannot lower the dot to tensor-core MMA.
  wrong: |
    BLOCK_M, BLOCK_N, BLOCK_K = 64, 64, 8
    acc = tl.dot(a, b, acc)  # a is [64, 8]
  correct: |
    BLOCK_M, BLOCK_N, BLOCK_K = 64, 64, 32
  check: {problem: l1_002_standard_matrix_multiplication, expect: static, match: dot_min_dim}

- id: smem_budget_per_config
  severity: critical
  stages: [tensor_descriptors, device_specific, autotuning]
  rule: >-
    A config's pipelined tiles must fit the device's shared memory per block:
    num_stages * (BLOCK_M * BLOCK_K + BLOCK_K * BLOCK_N) * elem_bytes <= the opt-in limit
    (99 KB on sm_120, 227 KB on sm_90 and sm_100). Over it the launch fails with
    OutOfResources.
  wrong: |
    # 3 * (256*64 + 64*256) * 2 B = 192 KB
    BLOCK_M, BLOCK_N, BLOCK_K = 256, 256, 64
    kernel[grid](..., num_warps=8, num_stages=3)
  correct: |
    # 3 * (64*32 + 32*64) * 2 B = 24 KB
    BLOCK_M, BLOCK_N, BLOCK_K = 64, 64, 32
    kernel[grid](..., num_warps=4, num_stages=3)
  check: {problem: l1_002_standard_matrix_multiplication, expect: error, match: shared memory}

- id: register_budget
  severity: critical
  stages: [fusion, device_specific, autotuning]
  rule: >-
    The fp32 accumulator lives in registers: BLOCK_M * BLOCK_N / (32 * num_warps) values per
    thread, on top of addresses and loaded tiles. Above about 128 per thread the compiler
    spills to local memory and the kernel slows several times. Give a big tile more warps or
    use a smaller tile; `smforge-skill facts` reports spills.
  wrong: |
    # 256*128 / 64 threads = 512 accumulator values per thread: spills
    BLOCK_M, BLOCK_N, BLOCK_K = 256, 128, 32
    kernel[grid](..., num_warps=2, num_stages=2)
  correct: |
    # 256*128 / 256 threads = 128 per thread
    BLOCK_M, BLOCK_N, BLOCK_K = 256, 128, 32
    kernel[grid](..., num_warps=8, num_stages=2)
  check: {problem: l1_002_standard_matrix_multiplication, variant: bench-gpu, expect: slower}

- id: accumulate_in_fp32
  severity: critical
  stages: []
  rule: >-
    Keep the K-loop accumulator in float32 for fp16, bf16 and fp8 inputs, and cast only when
    storing. A low-precision accumulator stops absorbing partial sums once it grows: in bf16
    a running sum near 1e5 has a spacing of 1024.
  wrong: |
    acc = tl.zeros((BLOCK_M, BLOCK_N), dtype=tl.bfloat16)
    for k in range(0, K, BLOCK_K):
        acc = (acc.to(tl.float32) + tl.dot(a, b)).to(tl.bfloat16)
  correct: |
    acc = tl.zeros((BLOCK_M, BLOCK_N), dtype=tl.float32)
    for k in range(0, K, BLOCK_K):
        acc = tl.dot(a, b, acc)
    tl.store(c_ptrs, acc.to(c_ptr.dtype.element_ty), mask=mask)
  check: {problem: l1_006_matmul_with_large_k_dimension, expect: mismatch}

- id: fp32_dot_input_precision
  severity: critical
  stages: [dtype_fix, fusion, device_specific, autotuning]
  rule: >-
    tl.dot on float32 operands defaults to TF32 (input_precision="tf32"), which keeps 10
    mantissa bits. A float32 problem is checked against a float64 run of the reference at
    rtol 1e-4, which TF32 fails. Pass input_precision="ieee", or "tf32x3" where the
    tolerance allows it.
  wrong: |
    acc = tl.dot(a, b, acc)  # a, b are float32
  correct: |
    acc = tl.dot(a, b, acc, input_precision="ieee")
  check: {problem: l2_014_gemm_divide_sum_scaling, variant: bench-gpu, expect: mismatch}

- id: strides_from_the_tensor
  severity: critical
  stages: []
  rule: >-
    Pass every operand's strides from tensor.stride() and index with them. Inputs can be
    transposed or otherwise non-contiguous views, and strides computed from the shape are
    then wrong.
  wrong: |
    # A is (K, M); assumes A.T is contiguous
    kernel[grid](A, B, C, M, N, K, 1, K, B.stride(0), B.stride(1), ...)
  correct: |
    kernel[grid](A, B, C, M, N, K, A.stride(0), A.stride(1), B.stride(0), B.stride(1), ...)
  check: {problem: l1_016_matmul_with_transposed_a, expect: mismatch}

- id: mask_the_k_tail
  severity: critical
  stages: [memory_access, tensor_descriptors, device_specific, autotuning]
  rule: >-
    When K is not a multiple of BLOCK_K, the last K tile must be masked on both operands with
    other=0.0. Unmasked, it reads past each row into the next one or past the allocation.
    Drop the mask only behind a compile-time EVEN_K = K % BLOCK_K == 0.
  wrong: |
    a = tl.load(a_ptrs, mask=mask_m[:, None], other=0.0)
    b = tl.load(b_ptrs, mask=mask_n[None, :], other=0.0)
  correct: |
    k_rem = K - k0
    a = tl.load(a_ptrs, mask=mask_m[:, None] & (offs_k[None, :] < k_rem), other=0.0)
    b = tl.load(b_ptrs, mask=(offs_k[:, None] < k_rem) & mask_n[None, :], other=0.0)
  check: {problem: l1_008_matmul_with_irregular_shapes, expect: mismatch}

- id: group_m_swizzle_needs_1d_grid
  severity: critical
  stages: [memory_access, device_specific, autotuning]
  rule: >-
    GROUP_M swizzling maps one program id to (pid_m, pid_n), so the grid must be 1D with
    cdiv(M, BLOCK_M) * cdiv(N, BLOCK_N) programs. On a 2D grid most tiles are never computed.
  wrong: |
    grid = (triton.cdiv(M, BLOCK_M), triton.cdiv(N, BLOCK_N))
    pid = tl.program_id(0)  # then the GROUP_M mapping
  correct: |
    grid = (triton.cdiv(M, BLOCK_M) * triton.cdiv(N, BLOCK_N),)
  check: {problem: l1_002_standard_matrix_multiplication, expect: mismatch}

- id: atomic_accumulator_zeroed
  severity: critical
  stages: [persistent_kernel, fusion]
  rule: >-
    A buffer that programs tl.atomic_add into (split-K, stream-K, scatter-reduce) must start at
    zero: allocate it with torch.zeros, not torch.empty, which returns whatever the caching
    allocator held.
  wrong: |
    ws = torch.empty((M, N), device=A.device, dtype=torch.float32)
    splitk_kernel[grid](A, B, ws, ...)  # tl.atomic_add(ws_ptr + offs, acc, mask=mask)
  correct: |
    ws = torch.zeros((M, N), device=A.device, dtype=torch.float32)
  check: {problem: l1_006_matmul_with_large_k_dimension, expect: mismatch}

- id: autotune_reset_to_zero
  severity: critical
  stages: [autotuning]
  rule: >-
    The autotuner runs each config several times on the real arguments. A kernel that
    accumulates into an output (atomics, +=) must list that argument in reset_to_zero (or
    restore_value), or the first call returns the sum of every benchmark run.
  wrong: |
    @triton.autotune(configs=configs, key=["M", "N", "K"])
    @triton.jit
    def splitk_kernel(a_ptr, b_ptr, ws_ptr, ...):  # tl.atomic_add into ws_ptr
  correct: |
    @triton.autotune(configs=configs, key=["M", "N", "K"], reset_to_zero=["ws_ptr"])
  check: {problem: l1_006_matmul_with_large_k_dimension, expect: mismatch}

- id: row_block_covers_the_row
  severity: critical
  stages: []
  rule: >-
    A kernel that loads a whole row in one tl.load needs BLOCK >= the row length:
    BLOCK = triton.next_power_of_2(N), with the tail masked. A smaller fixed BLOCK silently
    reduces over the first BLOCK columns only. Rows too long for registers need a loop over
    BLOCK-sized chunks instead.
  wrong: |
    BLOCK = 1024  # N = 4096
    x = tl.load(x_ptr + row * stride + offs, mask=offs < N, other=0.0)
  correct: |
    BLOCK = triton.next_power_of_2(N)
  check: {problem: inf_rmsnorm, expect: mismatch}

- id: no_torch_compute_in_forward
  severity: critical
  stages: []
  rule: >-
    forward and the helpers it calls may only allocate tensors and change views, layouts and
    dtypes. Every arithmetic op, reduction and activation has to run in a Triton kernel;
    torch.relu, F.*, .sum(), @ and submodule calls fail the audit, as does any cuBLAS, cuDNN
    or ATen compute kernel in the launch profile.
  wrong: |
    gemm_kernel[grid](x, w, out, ...)
    return torch.relu(out)
  correct: |
    # tl.maximum(acc, 0.0) in the kernel's epilogue
    gemm_relu_kernel[grid](x, w, out, ...)
    return out
  check: {problem: l2_076_gemm_add_relu, expect: static, match: torch_compute_call}

- id: no_host_sync_in_forward
  severity: warning
  stages: []
  rule: >-
    Nothing in forward may wait for the GPU: no .item(), .cpu(), .tolist(), printing device
    tensors or torch.cuda.synchronize(). A sync drains the launch queue, so the next kernel
    starts only after the CPU has caught up.
  wrong: |
    kernel[grid](...)
    torch.cuda.synchronize()
    return out
  correct: |
    kernel[grid](...)
    return out
  check: {problem: l2_076_gemm_add_relu, expect: static, match: host_sync}

- id: arange_length_power_of_two
  severity: critical
  stages: []
  rule: >-
    tl.arange(start, end) needs end - start to be a power of two. Cover other lengths with a
    power-of-two block and a mask.
  wrong: |
    offs_k = tl.arange(0, 96)
  correct: |
    offs_k = tl.arange(0, 128)
    mask_k = offs_k < 96
  check: {problem: l2_076_gemm_add_relu, expect: static, match: arange_pow2}

- id: num_warps_power_of_two
  severity: critical
  stages: [device_specific, autotuning]
  rule: >-
    num_warps must be a power of two (1 to 32); Triton lays out tensors across warps by
    halving.
  wrong: |
    kernel[grid](..., num_warps=6)
  correct: |
    kernel[grid](..., num_warps=4)
  check: {problem: l2_076_gemm_add_relu, expect: static, match: num_warps}

- id: no_output_caching
  severity: critical
  stages: []
  rule: >-
    forward must compute its result from the inputs on every call. Returning a tensor kept
    from an earlier call fails the second input draw of the correctness check.
  wrong: |
    def forward(self, x):
        if hasattr(self, "_out"):
            return self._out
        self._out = self._forward(x)
        return self._out
  correct: |
    def forward(self, x):
        return self._forward(x)
  check: {problem: l2_076_gemm_add_relu, expect: mismatch}

- id: mask_tail_stores
  severity: critical
  stages: []
  rule: >-
    Mask tl.store with the same bounds as the loads. An unmasked store of a tail tile writes
    past the row into the next one, or past the allocation into other tensors.
  wrong: |
    tl.store(c_ptrs, c)
  correct: |
    tl.store(c_ptrs, c, mask=mask_m[:, None] & mask_n[None, :])
  check: {problem: l1_008_matmul_with_irregular_shapes, expect: mismatch}
