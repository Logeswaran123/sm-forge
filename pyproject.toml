[project]
name = "sm-forge"
version = "0.4.0"
description = "Multi-stage LLM-driven optimization of Triton kernels for NVIDIA GPUs"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=2.3",
  "numpy>=1.24",
  "pydantic>=2.0",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
cu128 = [
  "torch>=2.9",
  "triton>=3.5",
  "cuda-bindings>=12.8",
]
plot = [
  "matplotlib>=3.8",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
]

[project.scripts]
smforge = "smforge.cli:main"
smforge-skill = "smforge.skill_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smforge"]

[tool.uv.sources]
torch = { index = "pytorch-cu128", extra = "cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs an NVIDIA GPU"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/kernels", "corpus/kernelbench", "corpus/inference"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "Q", "UP", "B", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["smforge"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
